# Maxora — raccoglie foto candidate (licenza libera) da Wikimedia Commons nel ramo "foto-candidati"
name: Foto candidate luoghi

# Solo manuale: GitHub → Actions → "Foto candidate luoghi" → Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Coordinate
        run: python3 tools/geo.py "Calderón Hondo" "Calderon Hondo, La Oliva" "Lagos de El Cotillo" "Mirador Morro Velosa"
      - name: Cerca e scarica
        run: python3 tools/fetch_photos.py /tmp/foto
      - name: Pubblica nel ramo foto-candidati
        run: |
          cd /tmp/foto
          git init -q -b foto-candidati
          git config user.name "maxora-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Foto candidate da Wikimedia Commons"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" foto-candidati
