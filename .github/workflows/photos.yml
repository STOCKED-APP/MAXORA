# Maxora — raccoglie foto candidate (licenza libera) da Wikimedia Commons nel ramo "foto-candidati"
name: Foto candidate luoghi

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/fetch_photos.py'
      - 'tools/geo.py'
      - '.github/workflows/photos.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Coordinate
        run: python3 tools/geo.py "Calderón Hondo" "Calderon Hondo, La Oliva" "Lagos de El Cotillo" "Mirador Morro Velosa"
      - name: Cerca e scarica
        if: false
        env:
          ONLY: isla-de-lobos,la-pared
        run: python3 tools/fetch_photos.py /tmp/foto
      - name: Pubblica nel ramo foto-candidati
        if: false
        run: |
          cd /tmp/foto
          git init -q -b foto-candidati
          git config user.name "maxora-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Foto candidate da Wikimedia Commons"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" foto-candidati:foto-candidati-2
