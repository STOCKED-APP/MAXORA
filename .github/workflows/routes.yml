# Maxora — percorsi bici e corsa: tracciati su OpenStreetMap, quote Copernicus DEM. Ogni primo del mese e quando cambia la lista.
name: Percorsi

on:
  schedule:
    - cron: '29 5 1 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/routes_src.json'
      - 'tools/build_routes.py'
      - '.github/workflows/routes.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: routes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q numpy rasterio
      - run: python3 tools/build_routes.py data/routes_src.json data/routes.json
      - name: Pubblica
        run: |
          git config user.name "maxora-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/routes.json
          if git diff --cached --quiet; then echo "Nessun cambiamento"; exit 0; fi
          git commit -qm "Percorsi aggiornati"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds || true
