# Maxora — percorsi bici e corsa: tracciati su OpenStreetMap, quote Copernicus DEM. Ogni primo del mese e quando cambia la lista.
name: Percorsi

on:
  schedule:
    - cron: '29 5 * * 1'      # ogni lunedì: sentieri e strade OSM sempre aggiornati
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/routes_src.json'
      - 'tools/build_routes.py'
      - '.github/workflows/routes.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: routes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool && pip install -q numpy rasterio osmium
      - name: Sentieri ufficiali e cime da OpenStreetMap (estratto Geofabrik)
        run: |
          curl -fsSL --retry 3 -A "Maxora/0.9 (+https://github.com/STOCKED-APP/MAXORA)" -o c.pbf https://download.geofabrik.de/africa/canary-islands-latest.osm.pbf
          osmium extract -b -14.55,27.99,-13.70,28.80 c.pbf -o fv.pbf --overwrite
      - run: python3 tools/build_routes.py data/routes_src.json data/routes.json fv.pbf
      - name: Pubblica
        run: |
          git config user.name "maxora-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/routes.json data/routes_report.json
          if git diff --cached --quiet; then echo "Nessun cambiamento"; exit 0; fi
          git commit -qm "Percorsi aggiornati"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds || true
