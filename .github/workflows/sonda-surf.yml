name: Sonda surf
on:
  push:
    branches: [sonda-surf]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q ecmwf-opendata cfgrib eccodes xarray numpy rasterio
      - run: python3 tools/build_routes.py data/routes_src.json data/routes.json
        continue-on-error: true
      - run: python3 tools/build_weather.py data/weather.json
        continue-on-error: true
      - if: always()
        run: |
          git config user.name maxora-bot; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/routes.json data/weather.json 2>/dev/null; git commit -qm "out [skip ci]" && git push -q
