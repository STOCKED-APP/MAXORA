name: Sonda surf
on:
  push:
    branches: [sonda-surf]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool && pip install -q osmium
      - run: |
          curl -fsSL --retry 3 -A "Maxora/0.9" -o c.pbf https://download.geofabrik.de/africa/canary-islands-latest.osm.pbf
          osmium extract -b -14.55,27.99,-13.70,28.80 c.pbf -o fv.pbf --overwrite
          python3 tools/routes_probe.py fv.pbf
      - if: always()
        run: |
          git config user.name maxora-bot; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f probe_out.txt && git commit -qm "out [skip ci]" && git push -q
