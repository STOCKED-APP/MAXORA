# Verifica temporanea: le ortofoto PNOA coprono Fuerteventura?
name: Verifica satellite
on:
  push:
    paths: ['.github/workflows/check-tiles.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica tile di prova
        run: |
          for z in "13 3412 3780" "15 13651 15121" "17 54606 60487" "18 109213 120975"; do
            set -- $z
            url="https://www.ign.es/wmts/pnoa-ma?request=GetTile&service=WMTS&VERSION=1.0.0&Layer=OI.OrthoimageCoverage&Style=default&Format=image%2Fjpeg&TileMatrixSet=GoogleMapsCompatible&TileMatrix=$1&TileRow=$2&TileCol=$3"
            r=$(curl -s -o t.jpg -w "%{http_code} %{content_type} %{size_download}" -H "Origin: https://stocked-app.github.io" -D h.txt "$url")
            cors=$(grep -i "access-control-allow-origin" h.txt | tr -d '\r')
            echo "::notice::z$1 -> $r | $cors"
          done
