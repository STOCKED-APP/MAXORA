name: Sonda camper
on: { push: { branches: [sonda-camper] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: geocode
        run: |
          cat > g.py <<'PY'
          import json, time, urllib.request, urllib.parse
          Q = ["Puertito de la Cruz, Fuerteventura", "Faro del Tostón, El Cotillo", "Ermita de San Benito Abad, Pájara", "Playa del Junquillo, Fuerteventura",
               "Calle Tenesor, Puerto del Rosario", "Playa del Mal Nombre, Fuerteventura", "Playa de Sotavento, Fuerteventura", "Muelle de Morro Jable", "Playa de Butihondo",
               "Playa de la Mujer, Tindaya", "Caleta Beatriz, Fuerteventura", "Mararía, La Oliva", "Playa de Tabaibejo, Fuerteventura", "Playa de Guerepe", "Playa de Bigocho",
               "Puerto Nuevo, Pájara", "Estadio Juan Laso, Antigua", "Playa de Baja Gómez", "Playa de La Escalera, La Oliva", "Risco del Paso, Fuerteventura", "Puerto de Morro Jable"]
          out = []
          for q in Q:
              u = 'https://nominatim.openstreetmap.org/search?' + urllib.parse.urlencode({'q': q, 'format': 'json', 'limit': 2, 'viewbox': '-14.55,28.80,-13.80,27.99', 'bounded': 1})
              try:
                  r = json.loads(urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'Maxora/0.14 (+https://github.com/STOCKED-APP/MAXORA)'}), timeout=30).read())
              except Exception as e:
                  r = [{'error': str(e)}]
              out.append(q + ' => ' + ' || '.join('%s,%s %s/%s %s' % (x.get('lat'), x.get('lon'), x.get('class'), x.get('type'), (x.get('display_name') or x.get('error') or '')[:70]) for x in r))
              time.sleep(1.2)
          print('::notice::' + ' ## '.join(out[:7]))
          print('::notice::' + ' ## '.join(out[7:14]))
          print('::notice::' + ' ## '.join(out[14:]))
          PY
          python3 g.py
