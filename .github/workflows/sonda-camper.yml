name: Sonda camper
on: { push: { branches: [sonda-camper] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          Q='[out:json][timeout:90];(nwr["name"~"Laso|Antigua",i]["leisure"](27.99,-14.55,28.80,-13.80);nwr["leisure"="stadium"](28.35,-14.1,28.45,-13.95););out center tags;'
          for u in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter; do
            curl -s -m 120 -A "Maxora/0.13 (+https://github.com/STOCKED-APP/MAXORA)" --data-urlencode "data=$Q" "$u" -o o.json && head -c 1 o.json | grep -q '{' && break
          done
          echo "::notice::$(head -c 300 o.json | tr '\n' ' ')"
          cat > p.py <<'PY'
          import json
          d=json.load(open('o.json'))
          for e in d['elements']:
              c=e.get('center') or e; t=e.get('tags',{})
              print('::notice::%s%s %s,%s %s' % (e['type'][0],e['id'],round(c.get('lat',0),6),round(c.get('lon',0),6),json.dumps(t,ensure_ascii=False)[:350]))
          PY
          python3 p.py || true
