name: Sonda mappa
on:
  push:
    branches: [sonda-mappa]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sleep 5
      - run: npm i playwright@1.49.1 && npx playwright install --with-deps chromium webkit
      - run: mkdir -p shots && node shot.js
      - if: always()
        run: |
          git config user.name maxora-bot; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shots && git commit -qm "screenshot [skip ci]" && git push -q
