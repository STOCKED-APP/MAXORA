# Maxora — aggiorna ogni notte i luoghi (ristoranti, spiagge, benzinai…) da OpenStreetMap
name: Aggiorna luoghi

on:
  schedule:
    - cron: '23 3 * * *'      # ogni notte alle 03:23 UTC
  workflow_dispatch:
  push:
    paths:
      - 'tools/build_pois.py'
      - 'tools/build_protected.py'
      - 'tools/build_land.py'
      - 'tools/build_radars.py'
      - '.github/workflows/pois.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: pois
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Installa osmium
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool

      - name: Scarica le Canarie (Geofabrik)
        run: |
          UA="Maxora/0.3 (+https://github.com/STOCKED-APP/MAXORA)"
          curl -fsSL --retry 3 -A "$UA" -o canarias.osm.pbf https://download.geofabrik.de/africa/canary-islands-latest.osm.pbf \
            || curl -fsSL --retry 3 -A "$UA" -o canarias.osm.pbf https://download.geofabrik.de/europe/spain/canarias-latest.osm.pbf

      - name: Estrai Fuerteventura e i tipi di luogo
        run: |
          osmium extract -b -14.55,27.99,-13.80,28.80 canarias.osm.pbf -o fv.osm.pbf --overwrite
          osmium tags-filter fv.osm.pbf \
            nwr/amenity=restaurant,fast_food,cafe,bar,pub,fuel,pharmacy,parking,drinking_water,water_point,bicycle_repair_station,bicycle_rental \
            nwr/natural=beach \
            nwr/shop=supermarket,convenience,surf,bicycle \
            nwr/tourism=viewpoint,hotel,apartment,hostel,guest_house \
            nwr/sport=surfing,kitesurfing,windsurfing \
            nwr/amenity=sanitary_dump_station,shower,toilets,washing_machine \
            nwr/tourism=camp_site,caravan_site \
            nwr/shop=laundry,gas \
            nwr/leisure=fitness_centre \
            -o filtered.osm.pbf --overwrite
          osmium export filtered.osm.pbf -f geojsonseq --add-unique-id=type_id -o filtered.geojsonseq --overwrite

      - name: Aree protette (dove non si può pernottare)
        run: |
          pip install -q shapely
          osmium tags-filter fv.osm.pbf nwr/boundary=protected_area,national_park nwr/leisure=nature_reserve -o prot.osm.pbf --overwrite
          osmium export prot.osm.pbf -f geojsonseq --geometry-types=polygon -o prot.geojsonseq --overwrite
          python3 tools/build_protected.py prot.geojsonseq data/protected.json

      - name: Sagoma dell'isola (per l'animazione del mare)
        run: |
          osmium tags-filter fv.osm.pbf w/natural=coastline -o coast.osm.pbf --overwrite
          osmium export coast.osm.pbf -f geojsonseq -o coast.geojsonseq --overwrite
          python3 tools/build_land.py coast.geojsonseq data/land.json

      - name: Radar fissi e tutor
        run: |
          osmium tags-filter fv.osm.pbf n/highway=speed_camera r/type=enforcement -o radar.osm.pbf --overwrite
          osmium cat radar.osm.pbf -f opl -o radar.opl --overwrite
          python3 tools/build_radars.py radar.opl data/radars.json

      - name: Crea data/pois.json
        run: |
          echo "::notice::righe=$(wc -l < filtered.geojsonseq) dimensione=$(stat -c %s filtered.geojsonseq) prima=$(head -c 300 filtered.geojsonseq | tr -d '\036\n' | cut -c1-250)"
          python3 tools/build_pois.py filtered.geojsonseq data/pois.json

      - name: Pubblica se cambiato
        run: |
          git config user.name "maxora-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pois.json data/protected.json data/land.json data/radars.json
          if git diff --cached --quiet; then echo "Nessun cambiamento"; exit 0; fi
          git commit -m "Luoghi aggiornati da OpenStreetMap"
          git push
          # chiede a GitHub Pages di ripubblicare il sito
          curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds || true
