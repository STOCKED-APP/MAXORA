<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#13171c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Maxora — La isla, en tiempo real</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link href="assets/theme.css" rel="stylesheet">
<link href="assets/app.css" rel="stylesheet">
<script>
  // Tema prima del primo disegno (evita il lampo bianco)
  (function () {
    var t = 'auto';
    try { t = localStorage.getItem('maxora_theme') || 'auto'; } catch (e) {}
    var dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
</head>
<body>
<div id="map" aria-label="Mapa"></div>

<header class="top">
  <button class="searchbar" id="searchOpen">
    <span class="brand">maxora</span>
    <span class="sb-sep" aria-hidden="true"></span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <span class="sb-ph" id="searchPh"></span>
  </button>
  <button class="sb-x hidden" id="resultsClose" aria-label="Cerrar resultados">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <button class="locate" id="centerBtn" aria-label="Centrar en mi posición">
    <span class="dot" id="gpsDot"></span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
  </button>
</header>

<button class="layers-btn" id="layersBtn" aria-pressed="false">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>
</button>

<button class="layers-btn surf-btn" id="surfBtn" aria-pressed="false">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 16c2 0 2.5-1.5 5-1.5S9.5 16 12 16s2.5-1.5 5-1.5 3 1.5 5 1.5"/><path d="M2 20c2 0 2.5-1.5 5-1.5S9.5 20 12 20s2.5-1.5 5-1.5 3 1.5 5 1.5"/><path d="M5.5 12.5C6 8 9 5 13 5c2.5 0 4.2 1.3 4.2 3.2 0 1.6-1.2 2.6-2.7 2.6-1.3 0-2.2-.8-2.2-1.9"/></svg>
</button>

<!-- Ricerca -->
<div class="search hidden" id="search" role="dialog" aria-modal="true" aria-label="Buscar">
  <div class="search-head">
    <button class="icon-btn" id="searchBack" aria-label="Volver">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <input id="searchInput" type="search" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
    <button class="icon-btn hidden" id="searchClear" aria-label="Borrar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="search-body" id="searchBody"></div>
</div>

<!-- Risultati sulla mappa -->
<button class="area-btn hidden" id="areaBtn"></button>
<div class="results hidden" id="results">
  <div class="r-track" id="rTrack"></div>
</div>

<!-- Scheda luogo -->
<section class="place hidden" id="place" aria-live="polite">
  <button class="icon-btn place-close" id="placeClose" aria-label="Cerrar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div id="placeBody"></div>
</section>

<div id="broadcast" class="broadcast hidden" role="status">
  <span id="broadcastText"></span>
  <button id="broadcastClose" aria-label="Cerrar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
</div>

<!-- Avviso di prossimità -->
<div id="alert" class="alert hidden" role="alert">
  <div class="alert-mark" id="alertMark"></div>
  <div class="alert-body">
    <div class="alert-dist mono" id="alertDist"></div>
    <div class="alert-title" id="alertTitle"></div>
  </div>
  <div class="alert-actions">
    <button class="btn-solid" id="alertYes"></button>
    <button class="btn-ghost" id="alertNo"></button>
  </div>
</div>

<!-- Scheda principale (apribile / richiudibile) -->
<section id="sheet" class="sheet">
  <button class="sheet-handle" id="sheetToggle" aria-expanded="true" aria-controls="sheetBody">
    <span class="grip"></span>
    <span class="sh-title" id="aheadTitle"></span>
    <span class="sh-sub" id="aheadSub"></span>
    <svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
  </button>

  <div class="sheet-body" id="sheetBody">
    <!-- la strada come linea dritta: tu → avvisi in ordine di distanza -->
    <div class="road" id="road" aria-hidden="true"></div>

    <!-- il prossimo avviso, detto in parole -->
    <div class="hero" id="hero">
      <div class="hero-ico" id="heroIco"></div>
      <div class="hero-txt">
        <div class="hero-t" id="heroTitle"></div>
        <div class="hero-m" id="heroMeta"></div>
      </div>
      <div class="hero-votes" id="cardActions">
        <button class="vote yes" id="voteYes"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></button>
        <button class="vote no" id="voteNo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
    </div>

    <div class="then hidden" id="thenBox">
      <div class="then-h" id="thenTitle"></div>
      <div id="thenList"></div>
    </div>

    <div class="bottom-row">
      <button class="report-pill" id="reportBtn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span id="reportLabel"></span>
      </button>
      <button class="round-btn" id="discoverBtn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>
      </button>
      <button class="round-btn" id="settingsBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>
  </div>
</section>

<!-- Modalità surf -->
<section id="sfSheet" class="sheet sf-sheet hidden">
  <button class="sheet-handle" id="sfToggle" aria-expanded="true" aria-controls="sfBody">
    <span class="grip"></span>
    <span class="sh-title" id="sfTitle">Surf</span>
    <span class="sh-sub" id="sfSub"></span>
    <svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
  </button>
  <div class="sheet-body" id="sfBody">
    <div class="seg wide sf-level" id="sfLevel">
      <button data-lvl="1"></button><button data-lvl="2"></button><button data-lvl="3"></button>
    </div>
    <div class="sf-times" id="sfTimes"></div>
    <div class="sf-tide" id="sfTide"></div>
    <div class="adv" id="sfAdvice"></div>
    <div class="sf-list" id="sfList"></div>
    <p class="sf-note" id="sfNote"></p>
  </div>
</section>

<!-- Modalità bici e corsa -->
<section id="spSheet" class="sheet sp-sheet hidden">
  <button class="sheet-handle" id="spToggle" aria-expanded="true" aria-controls="spBody">
    <span class="grip"></span>
    <span class="sh-title" id="spTitle"></span>
    <span class="sh-sub" id="spSub"></span>
    <svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
  </button>
  <div class="sheet-body" id="spBody">
    <div class="sp-now" id="spNow"></div>
    <div class="sf-times" id="spTimes"></div>
    <div class="adv" id="spAdvice"></div>
    <div class="sf-list" id="spList"></div>
    <div class="sp-actions" id="spActions"></div>
    <p class="sf-note" id="spNote"></p>
  </div>
</section>

<section class="place sf-card sp-card hidden" id="spCard" aria-live="polite">
  <button class="icon-btn place-close" id="spClose" aria-label="Cerrar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div id="spCardBody"></div>
</section>

<section class="place sf-card hidden" id="sfCard" aria-live="polite">
  <button class="icon-btn place-close" id="sfClose" aria-label="Cerrar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div id="sfCardBody"></div>
</section>

<!-- Pannello: scegli tipo di avviso -->
<div class="overlay hidden" id="typesOverlay">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="typesTitle">
    <div class="panel-head">
      <h2 id="typesTitle"></h2>
      <button class="icon-btn" data-close aria-label="Cerrar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <p class="panel-sub" id="typesSub"></p>
    <div class="types" id="typesGrid"></div>
  </div>
</div>

<!-- Pannello: impostazioni -->
<div class="overlay hidden" id="settingsOverlay">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="panel-head">
      <h2 id="settingsTitle"></h2>
      <button class="icon-btn" data-close aria-label="Cerrar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="setting">
      <div class="setting-label" id="lblTheme"></div>
      <div class="seg" id="themeSeg">
        <button data-theme-val="auto"></button>
        <button data-theme-val="light"></button>
        <button data-theme-val="dark"></button>
      </div>
    </div>
    <div class="setting">
      <div class="setting-label" id="lblLang"></div>
      <div class="seg" id="langSeg">
        <button data-lang="es">ES</button>
        <button data-lang="en">EN</button>
        <button data-lang="it">IT</button>
        <button data-lang="de">DE</button>
      </div>
    </div>
    <label class="setting toggle">
      <span class="setting-label" id="lblVoice"></span>
      <input type="checkbox" id="voiceToggle">
    </label>
    <label class="setting toggle">
      <span class="setting-label" id="lblSound"></span>
      <input type="checkbox" id="soundToggle">
    </label>
    <div class="acct" id="acctBox"></div>
    <button class="tour-again" id="tourAgain"></button>
    <p class="panel-note" id="settingsNote"></p>
  </div>
</div>

<!-- Pannello: scopri l'isola -->
<div class="overlay hidden" id="discoverOverlay">
  <div class="panel tall" role="dialog" aria-modal="true" aria-labelledby="discoverTitle">
    <div class="panel-head">
      <h2 id="discoverTitle"></h2>
      <button class="icon-btn" data-close aria-label="Cerrar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="seg wide" id="discoverTabs">
      <button data-tab="places" class="on"></button>
      <button data-tab="businesses"></button>
    </div>
    <div class="discover-list" id="discoverList"></div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script src="assets/surf.js"></script>
<script src="assets/sport.js"></script>
<script src="assets/tour.js"></script>
<script src="assets/account.js"></script>
</body>
</html>
