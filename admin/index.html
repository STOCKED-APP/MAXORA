<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Maxora · Control</title>
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link href="../assets/theme.css" rel="stylesheet">
<link href="admin.css" rel="stylesheet">
<script>
  (function () {
    var t = 'auto';
    try { t = localStorage.getItem('maxora_admin_theme') || 'auto'; } catch (e) {}
    var dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
</head>
<body>

<!-- Accesso -->
<main id="login" class="login hidden">
  <form id="loginForm" class="login-card">
    <div class="wordmark">maxora</div>
    <h1>Centro de control</h1>
    <label>Email<input type="email" id="loginEmail" autocomplete="username" required></label>
    <label>Contraseña<input type="password" id="loginPass" autocomplete="current-password" required></label>
    <button type="submit" class="btn primary" id="loginBtn">Entrar</button>
    <p class="err" id="loginErr" role="alert"></p>
    <button type="button" class="btn ghost small" id="forgotBtn">¿Has olvidado la contraseña?</button>
  </form>
  <form id="newPassForm" class="login-card hidden">
    <div class="wordmark">maxora</div>
    <h1>Nueva contraseña</h1>
    <label>Nueva contraseña (mín. 10 caracteres)<input type="password" id="newPass" autocomplete="new-password" minlength="10" required></label>
    <label>Repite la contraseña<input type="password" id="newPass2" autocomplete="new-password" minlength="10" required></label>
    <button type="submit" class="btn primary" id="newPassBtn">Guardar y entrar</button>
    <p class="err" id="newPassErr" role="alert"></p>
  </form>
</main>

<!-- Pannello: la mappa dell'isola è il tabellone -->
<div id="shell" class="shell cc hidden">
  <div id="board" class="board" aria-label="Mapa de la isla"></div>

  <header class="cc-top">
    <button class="cc-brand" id="homeBtn" aria-label="Volver al mapa"><span class="wordmark">maxora<span>control</span></span></button>
    <div class="cc-status" id="ccStatus"></div>
    <div class="cc-menu-wrap">
      <button class="cc-icon" id="menuBtn" aria-label="Cuenta y ajustes" aria-expanded="false">⋯</button>
      <div class="cc-menu hidden" id="ccMenu">
        <button id="themeBtn">Tema</button>
        <a href="../" target="_blank" rel="noopener">Abrir app ↗</a>
        <button id="passBtn">Cambiar contraseña</button>
        <button id="logoutBtn">Salir</button>
      </div>
    </div>
  </header>

  <aside class="cc-feed" id="ccFeed" aria-label="Para mirar"></aside>
  <div class="cc-layers" id="ccLayers"></div>
  <div class="cc-hint" id="ccHint">Mantén pulsado el mapa para añadir algo ahí</div>

  <section class="cc-drawer" id="drawer" aria-hidden="true">
    <div class="dr-handle" id="drHandle"></div>
    <header class="dr-head">
      <div class="dr-titles">
        <div class="eyebrow" id="viewEyebrow"></div>
        <h1 id="viewTitle"></h1>
      </div>
      <button class="cc-icon" id="drClose" aria-label="Cerrar">✕</button>
    </header>
    <nav class="dr-tabs" id="drTabs"></nav>
    <div class="head-actions" id="headActions"></div>
    <section id="view" class="view"></section>
  </section>

  <nav class="cc-dock" id="dock" aria-label="Áreas"></nav>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/config.js"></script>
<script src="admin.js"></script>
</body>
</html>
